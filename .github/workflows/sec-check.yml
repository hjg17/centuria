name: Security Check
on: [push, pull_request]

env:
 REGISTRY: ghcr.io
 IMAGE_NAME: ${{ github.repository }}

jobs:
 scan-and-build:
   runs-on: ubuntu-latest
   permissions:
     contents: read
     packages: write
   steps:
     - name: checkout code
       uses: actions/checkout@v7
       with:
         fetch-depth: 0
     # Run gitleaks to scan for secrets in the repository
     - name: gitleaks
       uses: gitleaks/gitleaks-action@v3
       env:
         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
     # Build image locally
     - name: build image
       run: docker build -t app:${{ github.sha }} app
     # Scan image for vulnerabilities using Trivy
     - name: trivy scan
       uses: aquasecurity/trivy-action@v0.36.0
       with:
         image-ref: 'app:${{ github.sha }}'
         format: 'table'
         exit-code: '1'
         ignore-unfixed: true
         severity: 'CRITICAL,HIGH'
     - name: ghcr login
       if: github.event_name == 'push' && github.ref == 'refs/heads/main'
       uses: docker/login-action@v3
       with:
         registry: ghcr.io
         username: ${{ github.actor }}
         password: ${{ secrets.GITHUB_TOKEN }}
     - name: push image
       if: github.event_name == 'push' && github.ref == 'refs/heads/main'
       run: |
         docker tag app:${{ github.sha }} ghcr.io/${{ github.repository }}:${{ github.sha }}
         docker tag app:${{ github.sha }} ghcr.io/${{ github.repository }}:latest
         docker push ghcr.io/${{ github.repository }}:${{ github.sha }}
         docker push ghcr.io/${{ github.repository }}:latest
